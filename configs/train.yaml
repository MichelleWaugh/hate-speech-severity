model_name: xlm-roberta-base
max_length: 128
batch_size: 32
grad_accum_steps: 2
encoder_lr: 2e-5
head_lr: 1e-4
weight_decay: 0.01
layerwise_lr_decay: 0.9
epochs: 6
warmup_ratio: 0.06
max_grad_norm: 1.0
lambda_severity: 0.5
lambda_target: 0.2
target_head_detach: false
label_smoothing: 0.05
max_neither_ratio: 3.0
precision: auto
gradient_checkpointing: false
num_workers: 2
tokenize_num_proc: 2
seed: 42
selection_metric: val_macro_f1_class
early_stopping_patience: 2
eval_every_steps: 200
